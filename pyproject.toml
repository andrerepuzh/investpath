[project]
name = "investpath"
version = "0.1.0"
description = "InvestPath: an educational investment calculator"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.30.0",
]

[tool.setuptools]
py-modules = ["main", "calculator", "styles"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"